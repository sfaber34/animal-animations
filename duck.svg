<svg width="250" height="200" viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Legs (behind body) -->
  <g class="leg-left">
    <!-- Left leg -->
    <rect x="80" y="140" width="10" height="35" rx="5" fill="#E8A030" />
    <!-- Left foot -->
    <ellipse cx="85" cy="178" rx="18" ry="8" fill="#E8A030" />
    <path d="M70 178 L85 170 L85 186 Z" fill="#E8A030" />
  </g>

  <g class="leg-right">
    <!-- Right leg -->
    <rect x="110" y="140" width="10" height="35" rx="5" fill="#D4912A" />
    <!-- Right foot -->
    <ellipse cx="115" cy="178" rx="18" ry="8" fill="#D4912A" />
    <path d="M100 178 L115 170 L115 186 Z" fill="#D4912A" />
  </g>

  <!-- Main body group (bobs up and down) -->
  <g class="duck-body-group">
    <!-- Tail feathers -->
    <g class="tail">
      <ellipse cx="30" cy="85" rx="20" ry="12" fill="#F5D76E" transform="rotate(-20 30 85)" />
      <ellipse cx="25" cy="80" rx="15" ry="8" fill="#FFE599" transform="rotate(-30 25 80)" />
      <ellipse cx="35" cy="92" rx="12" ry="6" fill="#E8C547" transform="rotate(-10 35 92)" />
    </g>

    <!-- Body -->
    <ellipse cx="100" cy="100" rx="65" ry="50" fill="#F5D76E" />

    <!-- Body highlight -->
    <ellipse cx="90" cy="85" rx="40" ry="30" fill="#FFE599" opacity="0.6" />

    <!-- Belly -->
    <ellipse cx="105" cy="115" rx="45" ry="30" fill="#FFF8DC" />

    <!-- Wing -->
    <g class="wing">
      <ellipse cx="85" cy="100" rx="35" ry="25" fill="#E8C547" />
      <ellipse cx="75" cy="95" rx="20" ry="15" fill="#D4B13D" opacity="0.5" />
      <!-- Wing feather details -->
      <path d="M55 105 Q65 100 75 105" stroke="#D4B13D" stroke-width="2" fill="none" />
      <path d="M60 110 Q70 105 80 110" stroke="#D4B13D" stroke-width="2" fill="none" />
    </g>

    <!-- Neck -->
    <ellipse cx="150" cy="75" rx="25" ry="35" fill="#F5D76E" />

    <!-- Head -->
    <ellipse cx="165" cy="50" rx="30" ry="28" fill="#F5D76E" />

    <!-- Head highlight -->
    <ellipse cx="160" cy="42" rx="18" ry="15" fill="#FFE599" opacity="0.5" />

    <!-- Eye white -->
    <ellipse cx="175" cy="45" rx="12" ry="14" fill="white" />

    <!-- Eye pupil - googly style! -->
    <circle cx="180" cy="48" r="7" fill="#222" />
    <circle cx="182" cy="46" r="2.5" fill="white" />

    <!-- Eye lid for blink -->
    <ellipse class="eye-lid" cx="175" cy="45" rx="13" ry="15" fill="#F5D76E" style="transform-origin: 175px 45px;"
      clip-path="inset(50% 0 0 0)" />

    <!-- Eyebrow - gives goofy expression -->
    <path d="M163 32 Q175 28 188 35" stroke="#8B6914" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Beak -->
    <g class="beak">
      <!-- Upper beak -->
      <path d="M185 55 L220 52 Q225 58 220 62 L185 62 Q180 58 185 55 Z" fill="#E8A030" />
      <!-- Lower beak -->
      <path d="M185 62 L215 62 Q218 68 212 70 L185 68 Q182 65 185 62 Z" fill="#D4912A" />
      <!-- Nostril -->
      <circle cx="200" cy="57" r="2" fill="#C48820" />
      <!-- Beak line -->
      <path d="M185 60 L218 60" stroke="#C48820" stroke-width="1" />
    </g>

    <!-- Cheek blush - adds goofiness -->
    <ellipse cx="155" cy="58" rx="8" ry="5" fill="#FFB6C1" opacity="0.5" />

    <!-- Tuft of feathers on head -->
    <g>
      <ellipse cx="150" cy="28" rx="6" ry="10" fill="#E8C547" transform="rotate(-20 150 28)" />
      <ellipse cx="158" cy="25" rx="5" ry="12" fill="#F5D76E" transform="rotate(-5 158 25)" />
      <ellipse cx="165" cy="26" rx="4" ry="10" fill="#E8C547" transform="rotate(10 165 26)" />
    </g>
  </g>
</svg>

