<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffe Animated</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.70);
      --accent: #ffb74d;
      --stage: rgba(97, 123, 155, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 1100px;
      display: grid;
      /* Top-align the main content while keeping it centered horizontally */
      place-items: start center;
      background: radial-gradient(1200px 600px at 30% 20%, rgba(255, 183, 77, 0.18), transparent 55%),
        radial-gradient(900px 500px at 80% 60%, rgba(56, 189, 248, 0.16), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
        "Segoe UI Emoji";
    }

    .wrap {
      width: min(980px, calc(100vw - 32px));
      display: grid;
      gap: 16px;
      padding: 18px 0;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    .header .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 183, 77, 0.35);
      background: rgba(255, 183, 77, 0.12);
      color: #ffd38a;
      font-size: 12px;
      white-space: nowrap;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: linear-gradient(135deg, var(--stage), rgba(97, 123, 155, 0.12));
      overflow: hidden;
    }

    #svgMount {
      width: min(520px, 100%);
      display: block;
    }

    #svgMount svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      outline: 1px solid rgba(255, 255, 255, 0.10);
      background: transparent;
    }

    .note {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .error {
      color: #ffb4b4;
    }

    /* ===== Runner (second instance) ===== */
    :root {
      --across-duration: 8s;
      --runner-from-x: -300px;
      --runner-to-x: 1200px;
    }

    .runner-lane {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0px;
      height: 210px;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .runner {
      position: absolute;
      left: 0;
      bottom: 0;
      will-change: transform;
      animation: runnerAcross var(--across-duration) linear infinite;
    }

    .runner-scale {
      transform: scale(0.5);
      transform-origin: left bottom;
    }

    .runner object {
      width: 520px;
      height: auto;
      display: block;
      background: transparent;
    }

    body.paused .runner {
      animation-play-state: paused;
    }

    @keyframes runnerAcross {
      from {
        transform: translate3d(var(--runner-from-x), 0, 0);
      }

      to {
        transform: translate3d(var(--runner-to-x), 0, 0);
      }
    }
  </style>
</head>

<body>
  <div class="runner-lane" aria-hidden="true">
    <div class="runner" id="runner">
      <div class="runner-scale">
        <object id="runnerObj" data="./giraffe_animated.svg" type="image/svg+xml"></object>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="header">
      <h1>Giraffe Animated</h1>
      <div class="sub">Loads <code>giraffe_animated.svg</code> and controls the whole cycle duration</div>
    </div>

    <div class="panel controls">
      <label>
        Cycle duration
        <input id="duration" type="range" min="0.2" max="4" step="0.025" value="2.0" />
      </label>
      <div class="pill" id="durationLabel">2.000s</div>
      <button id="toggle" type="button">Pause</button>
    </div>

    <div class="panel stage">
      <div id="svgMount" aria-label="Giraffe animated SVG"></div>
    </div>

    <p class="note" id="status">Loading SVG…</p>
  </div>

  <script>
    // Svgator export in giraffe_animated.svg uses 2000ms (2s) for the full 0%→100% timeline.
    // We scale playbackRate for all animations so the *whole* cycle matches your chosen duration.
    const BASE_CYCLE_MS = 2000;
    // Runner tuning:
    // - Width-agnostic: runner always goes from just-offscreen-left to just-offscreen-right.
    // - Controls how fast it crosses the screen relative to the gait cycle.
    //   traverseSeconds = cycleSeconds * RUNNER_TRAVERSE_CYCLES / RUNNER_ADVANCE_MULT
    //   (so bigger RUNNER_ADVANCE_MULT => faster crossing)
    const RUNNER_TRAVERSE_CYCLES = 4.0;
    const RUNNER_ADVANCE_MULT = 1.1;
    const RUNNER_OFFSCREEN_PAD_PX = 20;

    const slider = document.getElementById('duration');
    const label = document.getElementById('durationLabel');
    const toggleBtn = document.getElementById('toggle');
    const statusEl = document.getElementById('status');
    const mount = document.getElementById('svgMount');
    const runnerObj = document.getElementById('runnerObj');

    let svgRoot = null;
    let runnerSvgRoot = null;
    let isPaused = false;

    function getStepDecimals() {
      const stepStr = String(slider.step || '');
      if (!stepStr || stepStr === 'any') return 3;
      const parts = stepStr.split('.');
      return parts.length === 2 ? parts[1].length : 0;
    }

    function formatSeconds(seconds) {
      const decimals = getStepDecimals();
      return Number(seconds).toFixed(decimals) + 's';
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
    }

    function getAnimationsFor(svgEl) {
      if (!svgEl) return [];
      if (typeof svgEl.getAnimations !== 'function') return [];
      return svgEl.getAnimations({ subtree: true });
    }

    function getAllAnimations() {
      return [
        ...getAnimationsFor(svgRoot),
        ...getAnimationsFor(runnerSvgRoot),
      ];
    }

    function updateRunnerBounds() {
      // Measure the *visual* (post-transform) runner width so we can go fully off-screen.
      const runnerScale = document.querySelector('.runner-scale');
      if (!runnerScale) return;

      const rect = runnerScale.getBoundingClientRect();
      const runnerWidth = rect.width || 0;
      const viewportWidth = window.innerWidth || 0;

      if (!runnerWidth || !viewportWidth) return;

      const fromX = -(runnerWidth + RUNNER_OFFSCREEN_PAD_PX);
      const toX = viewportWidth + RUNNER_OFFSCREEN_PAD_PX;

      document.documentElement.style.setProperty('--runner-from-x', `${fromX.toFixed(2)}px`);
      document.documentElement.style.setProperty('--runner-to-x', `${toX.toFixed(2)}px`);
    }

    function applyDuration() {
      const desiredSeconds = Number(slider.value);
      label.textContent = formatSeconds(desiredSeconds);

      const anims = getAllAnimations();
      if (!anims.length) return;

      // Width-agnostic runner motion: always offscreen->offscreen, duration tied to gait cycles.
      const traverseSeconds = (desiredSeconds * RUNNER_TRAVERSE_CYCLES) / RUNNER_ADVANCE_MULT;
      document.documentElement.style.setProperty('--across-duration', traverseSeconds.toFixed(3) + 's');
      updateRunnerBounds();

      // If BASE=2000ms and desired=4.0s, rate=0.5 (slower).
      const rate = BASE_CYCLE_MS / (desiredSeconds * 1000);

      anims.forEach(a => {
        a.playbackRate = rate;
        if (isPaused) a.pause();
        else a.play();
      });

      setStatus(`Duration applied to ${anims.length} animation(s).`);
    }

    function togglePlayPause() {
      isPaused = !isPaused;
      document.body.classList.toggle('paused', isPaused);
      toggleBtn.textContent = isPaused ? 'Play' : 'Pause';

      const anims = getAllAnimations();
      anims.forEach(a => (isPaused ? a.pause() : a.play()));
      if (anims.length) setStatus(`${isPaused ? 'Paused' : 'Playing'} ${anims.length} animation(s).`);
    }

    async function loadAndInlineSvg() {
      try {
        const res = await fetch('./giraffe_animated.svg', { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        mount.innerHTML = text;

        svgRoot = mount.querySelector('svg');
        if (!svgRoot) {
          setStatus('Loaded file, but could not find an <svg> root element.', true);
          return;
        }

        if (typeof svgRoot.getAnimations !== 'function') {
          setStatus('SVG loaded, but this browser does not support getAnimations() for SVG.', true);
          return;
        }

        // Wait a tick for the injected <style> to apply and animations to initialize.
        requestAnimationFrame(() => {
          const anims = getAnimationsFor(svgRoot);
          if (!anims.length) {
            setStatus('SVG loaded, but no animations were detected yet.', true);
            return;
          }
          const all = getAllAnimations();
          setStatus(`SVG loaded. Found ${all.length} animation(s).`);
          applyDuration();
        });
      } catch (e) {
        setStatus(`Failed to load ./giraffe_animated.svg (${String(e)}). Are you running a local server?`, true);
      }
    }

    function hookRunnerObject() {
      runnerObj.addEventListener('load', () => {
        try {
          runnerSvgRoot = runnerObj.contentDocument?.querySelector('svg') ?? null;
          // Apply current settings as soon as it loads.
          updateRunnerBounds();
          applyDuration();
        } catch {
          runnerSvgRoot = null;
        }
      });
    }

    slider.addEventListener('input', applyDuration);
    toggleBtn.addEventListener('click', togglePlayPause);

    // Initialize UI
    label.textContent = formatSeconds(slider.value);
    {
      const desiredSeconds = Number(slider.value);
      const traverseSeconds = (desiredSeconds * RUNNER_TRAVERSE_CYCLES) / RUNNER_ADVANCE_MULT;
      document.documentElement.style.setProperty('--across-duration', traverseSeconds.toFixed(3) + 's');
    }
    updateRunnerBounds();
    window.addEventListener('resize', () => updateRunnerBounds());
    document.body.classList.toggle('paused', isPaused);
    hookRunnerObject();
    loadAndInlineSvg();
  </script>
</body>

</html>
