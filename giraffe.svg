<svg width="250" height="200" viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Back legs (behind body) -->
  <g class="leg-back-left">
    <!-- Back left leg -->
    <rect x="45" y="115" width="12" height="55" rx="6" fill="#C4923A" />
    <!-- Back left hoof -->
    <ellipse cx="51" cy="175" rx="10" ry="6" fill="#5D4037" />
  </g>

  <g class="leg-back-right">
    <!-- Back right leg -->
    <rect x="62" y="115" width="12" height="55" rx="6" fill="#B8862F" />
    <!-- Back right hoof -->
    <ellipse cx="68" cy="175" rx="10" ry="6" fill="#4E342E" />
  </g>

  <!-- Front legs -->
  <g class="leg-front-left">
    <!-- Front left leg -->
    <rect x="115" y="115" width="12" height="55" rx="6" fill="#C4923A" />
    <!-- Front left hoof -->
    <ellipse cx="121" cy="175" rx="10" ry="6" fill="#5D4037" />
  </g>

  <g class="leg-front-right">
    <!-- Front right leg -->
    <rect x="132" y="115" width="12" height="55" rx="6" fill="#B8862F" />
    <!-- Front right hoof -->
    <ellipse cx="138" cy="175" rx="10" ry="6" fill="#4E342E" />
  </g>

  <!-- Main body group (bobs up and down) -->
  <g class="giraffe-body-group">
    <!-- Tail -->
    <g class="tail">
      <path d="M30 95 Q15 100 10 115 Q8 125 15 130" stroke="#C4923A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Tail tuft -->
      <ellipse cx="15" cy="132" rx="6" ry="10" fill="#8B6914" transform="rotate(20 15 132)"/>
    </g>

    <!-- Body -->
    <ellipse cx="95" cy="100" rx="60" ry="35" fill="#E8B84A" />
    
    <!-- Body spots -->
    <ellipse cx="70" cy="95" rx="12" ry="10" fill="#C4923A" transform="rotate(-15 70 95)" />
    <ellipse cx="95" cy="105" rx="10" ry="8" fill="#C4923A" />
    <ellipse cx="115" cy="90" rx="8" ry="10" fill="#C4923A" transform="rotate(10 115 90)" />
    <ellipse cx="55" cy="108" rx="7" ry="6" fill="#C4923A" />
    <ellipse cx="130" cy="100" rx="9" ry="7" fill="#C4923A" transform="rotate(-5 130 100)" />

    <!-- Body highlight -->
    <ellipse cx="85" cy="88" rx="30" ry="18" fill="#F5D76E" opacity="0.4" />

    <!-- Neck -->
    <path d="M140 95 Q155 80 165 50 Q170 35 175 20" stroke="#E8B84A" stroke-width="35" fill="none" stroke-linecap="round"/>
    
    <!-- Neck spots -->
    <ellipse cx="155" cy="65" rx="8" ry="6" fill="#C4923A" transform="rotate(-20 155 65)" />
    <ellipse cx="165" cy="45" rx="6" ry="8" fill="#C4923A" transform="rotate(-25 165 45)" />
    <ellipse cx="150" cy="82" rx="7" ry="5" fill="#C4923A" />

    <!-- Head -->
    <ellipse cx="185" cy="25" rx="25" ry="20" fill="#E8B84A" />
    
    <!-- Snout -->
    <ellipse cx="208" cy="32" rx="18" ry="12" fill="#F5D76E" />
    
    <!-- Nostrils -->
    <circle cx="218" cy="30" r="3" fill="#5D4037" />
    <circle cx="218" cy="36" r="3" fill="#5D4037" />

    <!-- Head highlight -->
    <ellipse cx="180" cy="20" rx="12" ry="10" fill="#F5D76E" opacity="0.5" />

    <!-- Eye white -->
    <ellipse cx="178" cy="22" rx="10" ry="12" fill="white" />

    <!-- Eye pupil - googly style! -->
    <circle cx="182" cy="24" r="6" fill="#222" />
    <circle cx="184" cy="22" r="2" fill="white" />

    <!-- Eye lid for blink -->
    <ellipse class="eye-lid" cx="178" cy="22" rx="11" ry="13" fill="#E8B84A" style="transform-origin: 178px 22px;"
      clip-path="inset(50% 0 0 0)" />

    <!-- Eyebrow -->
    <path d="M168 12 Q178 8 190 14" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Mouth - happy expression -->
    <path d="M200 40 Q210 45 220 42" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <ellipse cx="195" cy="35" rx="6" ry="4" fill="#FFB6C1" opacity="0.4" />

    <!-- Ears -->
    <ellipse cx="165" cy="12" rx="8" ry="5" fill="#E8B84A" transform="rotate(-30 165 12)" />
    <ellipse cx="165" cy="12" rx="5" ry="3" fill="#FFB6C1" transform="rotate(-30 165 12)" opacity="0.5" />
    
    <ellipse cx="190" cy="8" rx="8" ry="5" fill="#E8B84A" transform="rotate(30 190 8)" />
    <ellipse cx="190" cy="8" rx="5" ry="3" fill="#FFB6C1" transform="rotate(30 190 8)" opacity="0.5" />

    <!-- Ossicones (horns) -->
    <g class="ossicones">
      <!-- Left ossicone -->
      <rect x="170" y="2" width="5" height="14" rx="2.5" fill="#C4923A" />
      <circle cx="172.5" cy="2" r="4" fill="#5D4037" />
      
      <!-- Right ossicone -->
      <rect x="182" y="2" width="5" height="14" rx="2.5" fill="#C4923A" />
      <circle cx="184.5" cy="2" r="4" fill="#5D4037" />
    </g>

    <!-- Mane -->
    <g class="mane">
      <rect x="168" y="15" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-20 168 15)" />
      <rect x="163" y="25" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-25 163 25)" />
      <rect x="158" y="38" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-30 158 38)" />
      <rect x="152" y="52" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-35 152 52)" />
      <rect x="147" y="66" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-25 147 66)" />
      <rect x="143" y="78" width="4" height="8" rx="2" fill="#8B6914" transform="rotate(-15 143 78)" />
    </g>
  </g>
</svg>

